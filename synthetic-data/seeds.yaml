# ============================================================
# ORDM · Synthetic data · deterministic seeds
# ============================================================
# Same seed + same row counts => identical generated data, so committed
# samples are reproducible. Job parameters (widgets) override anything here.
# ============================================================

base_seed: 42

domains:
  customer:
    seed: 1001
    volumes:
      # Default row counts. Override via job parameters for scale tests.
      profiles: 1000
      accounts: 120
    fanout:
      # Max child rows generated per profile (actual count varies 1..max,
      # deterministically per profile).
      addresses_per_profile_max: 3
      contacts_per_profile_max: 3
      consents_per_profile_max: 4

  trade_promotion:
    seed: 2002
    volumes:
      products: 120
      stores: 30
      promotions: 60
      # NRF 4-5-4 fiscal calendar: first day must be a Sunday (week start).
      calendar_start_date: "2024-01-07"
      calendar_weeks: 110
      # Probability that a given product x store x day has a sales row.
      daily_sales_density: 0.06
    fanout:
      scope_products_per_promo_max: 15
      scope_stores_per_promo_max: 12
      promo_duration_weeks_max: 4
    seasonality:
      # Relative promo-density weight per fiscal quarter (Q1..Q4); peak in Q4.
      quarter_weights: [2, 1, 1, 4]
    post_promo:
      # The two value-killers, engineered into the synthetic sales so the
      # Post-Promotion ROI views have a real signal to detect.
      # forward_buy_weeks must match the N used by gold_promo_roi.
      forward_buy_weeks: 2
      forward_buy_dip_factor: 0.55        # promoted SKUs dip to 55% of baseline after the promo
      cannibalization_dip_factor: 0.70    # substitute SKUs dip to 70% of baseline during the promo
